[package]
name = "petstore_example_sdk"
version = "1.0.0"
edition = "2021"
description = "Generated Rust SDK for Swagger Petstore"
license = "MIT"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3"
bytes = "1"
