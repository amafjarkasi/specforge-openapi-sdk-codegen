<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-label="specforge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0f0a"/>
      <stop offset="50%" stop-color="#1c1008"/>
      <stop offset="100%" stop-color="#0f0a06"/>
    </linearGradient>
    <linearGradient id="forge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="ember" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2d1a0e" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="960" height="220" rx="24" fill="url(#bg)"/>
  <rect width="960" height="220" rx="24" fill="url(#grid)" opacity="0.5"/>
  <circle cx="820" cy="40" r="140" fill="url(#forge)" opacity="0.06"/>
  <circle cx="100" cy="200" r="100" fill="url(#ember)" opacity="0.05"/>

  <!-- === MASCOT (scaled into logo area) === -->
  <g transform="translate(48,38) scale(1.08)">
    <!-- background plate -->
    <rect x="4" y="4" width="120" height="120" rx="24" fill="#1a0f0a"/>
    <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#forge)" opacity="0.08"/>
    <rect x="6.5" y="6.5" width="115" height="115" rx="22" fill="none" stroke="url(#forge)" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- body -->
    <ellipse cx="64" cy="82" rx="22" ry="18" fill="#b45309"/>
    <ellipse cx="64" cy="82" rx="22" ry="18" fill="#d97706" opacity="0.4"/>

    <!-- apron -->
    <path d="M48 74c0-4 7-7 16-7s16 3 16 7v14c0 3-7 6-16 6s-16-3-16-6z" fill="#1e293b"/>
    <path d="M52 74v13c0 2 5.3 4.5 12 4.5s12-2.5 12-4.5V74" fill="none" stroke="#334155" stroke-width="1.2"/>

    <!-- head -->
    <ellipse cx="64" cy="48" rx="18" ry="16" fill="#d97706"/>

    <!-- ears -->
    <path d="M46 38l-6-14 10 8z" fill="#d97706"/>
    <path d="M47 36l-4-10 7 6z" fill="#fbbf24" opacity="0.6"/>
    <path d="M82 38l6-14-10 8z" fill="#d97706"/>
    <path d="M81 36l4-10-7 6z" fill="#fbbf24" opacity="0.6"/>

    <!-- face -->
    <ellipse cx="56" cy="46" rx="3.5" ry="4" fill="#1e293b"/>
    <ellipse cx="72" cy="46" rx="3.5" ry="4" fill="#1e293b"/>
    <circle cx="57" cy="44.5" r="1.2" fill="white"/>
    <circle cx="73" cy="44.5" r="1.2" fill="white"/>

    <!-- nose -->
    <ellipse cx="64" cy="52" rx="3" ry="2" fill="#1e293b"/>

    <!-- mouth -->
    <path d="M59 55c2 2 8 2 10 0" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

    <!-- goggles -->
    <path d="M48 40c0-3 4-5 8-5h16c4 0 8 2 8 5" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="54" cy="39" r="5" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="74" cy="39" r="5" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="54" cy="39" r="3" fill="#38bdf8" opacity="0.3"/>
    <circle cx="74" cy="39" r="3" fill="#38bdf8" opacity="0.3"/>

    <!-- left arm + hammer -->
    <path d="M42 78l-10 12" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
    <rect x="24" y="84" width="16" height="4" rx="2" fill="#92400e" transform="rotate(-25 32 86)"/>
    <rect x="18" y="78" width="12" height="8" rx="2" fill="url(#metal)" transform="rotate(-25 24 82)"/>

    <!-- right arm + document -->
    <path d="M86 78l8 10" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
    <rect x="88" y="84" width="16" height="20" rx="2" fill="#f8fafc" transform="rotate(10 96 94)"/>
    <rect x="88" y="84" width="16" height="20" rx="2" fill="none" stroke="url(#forge)" stroke-width="1" transform="rotate(10 96 94)"/>
    <line x1="92" y1="90" x2="100" y2="90" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" transform="rotate(10 96 95)"/>
    <line x1="92" y1="94" x2="98" y2="94" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" transform="rotate(10 96 95)"/>
    <line x1="92" y1="98" x2="96" y2="98" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" transform="rotate(10 96 95)"/>

    <!-- sparks -->
    <circle cx="28" cy="74" r="2" fill="#fbbf24" filter="url(#glow)" opacity="0.9"/>
    <circle cx="34" cy="70" r="1.5" fill="#f97316" filter="url(#glow)" opacity="0.8"/>
    <circle cx="22" cy="78" r="1" fill="#fde68a" filter="url(#glow)" opacity="0.7"/>

    <!-- anvil base -->
    <path d="M50 100h28c1.5 0 2.5 1 2.5 2.2v3.6c0 1.2-1 2.2-2.5 2.2H50c-1.5 0-2.5-1-2.5-2.2v-3.6c0-1.2 1-2.2 2.5-2.2z" fill="#475569" opacity="0.5"/>
  </g>

  <!-- wordmark -->
  <text x="210" y="108" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="64" font-weight="750" fill="url(#text)" letter-spacing="-1.5">specforge</text>
  <text x="214" y="148" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="22" font-weight="500" fill="#d97706" opacity="0.8">OpenAPI → typed SDKs for TypeScript, Go &amp; Rust</text>

  <!-- pills -->
  <g font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Helvetica, Arial" font-size="14" font-weight="600">
    <rect x="214" y="168" width="92" height="28" rx="14" fill="#1c1008" stroke="#92400e" stroke-opacity="0.5"/>
    <text x="260" y="187" text-anchor="middle" fill="#7dd3fc">TypeScript</text>
    <rect x="316" y="168" width="56" height="28" rx="14" fill="#1c1008" stroke="#92400e" stroke-opacity="0.5"/>
    <text x="344" y="187" text-anchor="middle" fill="#86efac">Go</text>
    <rect x="382" y="168" width="68" height="28" rx="14" fill="#1c1008" stroke="#92400e" stroke-opacity="0.5"/>
    <text x="416" y="187" text-anchor="middle" fill="#c4b5fd">Rust</text>
    <rect x="460" y="168" width="120" height="28" rx="14" fill="#1c1008" stroke="#92400e" stroke-opacity="0.5"/>
    <text x="520" y="187" text-anchor="middle" fill="#fde68a">IR pipeline</text>
  </g>
</svg>
