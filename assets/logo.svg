    </filter>
  </defs>
  <!-- rounded plate -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0b1220"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#g)" opacity="0.12"/>
  <rect x="10.5" y="10.5" width="107" height="107" rx="26" fill="none" stroke="url(#g)" stroke-opacity="0.45" stroke-width="1.5"/>

