<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="specforge mascot — Ember the fox engineer">
  <defs>
    <linearGradient id="flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hot" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="128" height="128" rx="28" fill="#0f0a06"/>
  <rect width="128" height="128" rx="28" fill="url(#flame)" opacity="0.06"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#flame)" stroke-opacity="0.2" stroke-width="1"/>

  <!-- === EMBER — the fox engineer === -->

  <!-- tail (behind body) -->
  <path d="M90 95c12-5 18-18 14-28-3-8-12-10-16-4-3 5 0 14-4 18" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
  <path d="M84 85c8-3 12-12 9-20-2-6-8-7-11-3" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

  <!-- body / torso -->
  <ellipse cx="62" cy="88" rx="20" ry="16" fill="#c2410c"/>
  <ellipse cx="62" cy="88" rx="20" ry="16" fill="#ea580c" opacity="0.3"/>

  <!-- chest fur -->
  <ellipse cx="62" cy="84" rx="12" ry="10" fill="#fed7aa" opacity="0.6"/>

  <!-- leather apron -->
  <path d="M48 80c0-3 6-6 14-6s14 3 14 6v12c0 2.5-6 5-14 5s-14-2.5-14-5z" fill="#78350f"/>
  <path d="M50 80v11c0 2 5.3 4 12 4s12-2 12-4V80" fill="none" stroke="#92400e" stroke-width="1"/>
  <!-- apron pocket -->
  <rect x="56" y="88" width="12" height="6" rx="1.5" fill="#92400e" stroke="#a16207" stroke-width="0.5"/>

  <!-- head -->
  <ellipse cx="62" cy="48" rx="20" ry="18" fill="#ea580c"/>

  <!-- cheek fur (lighter) -->
  <ellipse cx="52" cy="52" rx="8" ry="6" fill="#fdba74" opacity="0.4"/>
  <ellipse cx="72" cy="52" rx="8" ry="6" fill="#fdba74" opacity="0.4"/>

  <!-- muzzle -->
  <ellipse cx="62" cy="56" rx="10" ry="7" fill="#fdba74"/>

  <!-- ears -->
  <path d="M42 36l-8-16 12 10z" fill="#ea580c"/>
  <path d="M43 34l-5-12 9 8z" fill="#fde68a" opacity="0.5"/>
  <path d="M82 36l8-16-12 10z" fill="#ea580c"/>
  <path d="M81 34l5-12-9 8z" fill="#fde68a" opacity="0.5"/>

  <!-- eyes -->
  <ellipse cx="53" cy="46" rx="4.5" ry="5" fill="#fef3c7"/>
  <ellipse cx="71" cy="46" rx="4.5" ry="5" fill="#fef3c7"/>
  <ellipse cx="54" cy="46" rx="2.5" ry="3" fill="#1e293b"/>
  <ellipse cx="72" cy="46" rx="2.5" ry="3" fill="#1e293b"/>
  <circle cx="55" cy="44.5" r="1" fill="white"/>
  <circle cx="73" cy="44.5" r="1" fill="white"/>

  <!-- nose -->
  <ellipse cx="62" cy="54" rx="3.5" ry="2.5" fill="#1e293b"/>
  <ellipse cx="62" cy="53.5" rx="1.5" ry="0.8" fill="#475569" opacity="0.5"/>

  <!-- mouth -->
  <path d="M57 58c2.5 2 10 2 13 0" fill="none" stroke="#92400e" stroke-width="1.2" stroke-linecap="round"/>

  <!-- GOGGLES (pushed up on forehead) -->
  <path d="M40 38c0-4 5-7 10-7h20c5 0 10 3 10 7" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <!-- left lens -->
  <circle cx="50" cy="37" r="7" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="50" cy="37" r="5" fill="#38bdf8" opacity="0.15"/>
  <circle cx="50" cy="37" r="7" fill="none" stroke="#e2e8f0" stroke-width="0.5" opacity="0.3"/>
  <!-- right lens -->
  <circle cx="74" cy="37" r="7" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="74" cy="37" r="5" fill="#38bdf8" opacity="0.15"/>
  <circle cx="74" cy="37" r="7" fill="none" stroke="#e2e8f0" stroke-width="0.5" opacity="0.3"/>
  <!-- bridge -->
  <path d="M57 37h14" stroke="#94a3b8" stroke-width="2"/>

  <!-- left arm — raised with hammer -->
  <path d="M42 84l-14-10" stroke="#c2410c" stroke-width="7" stroke-linecap="round"/>
  <!-- hammer -->
  <rect x="16" y="60" width="4" height="18" rx="2" fill="#78350f" transform="rotate(15 18 69)"/>
  <rect x="12" y="56" width="14" height="8" rx="2.5" fill="url(#steel)" transform="rotate(15 19 60)"/>

  <!-- right arm — holding spec document -->
  <path d="M82 84l10-8" stroke="#c2410c" stroke-width="7" stroke-linecap="round"/>
  <!-- document -->
  <rect x="88" y="68" width="14" height="18" rx="2" fill="#f8fafc"/>
  <rect x="88" y="68" width="14" height="18" rx="2" fill="none" stroke="#f97316" stroke-width="0.8"/>
  <!-- doc content lines -->
  <line x1="91" y1="74" x2="99" y2="74" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <line x1="91" y1="78" x2="97" y2="78" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <line x1="91" y1="82" x2="95" y2="82" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <!-- doc badge -->
  <circle cx="98" cy="70" r="3" fill="#f97316"/>
  <path d="M96.5 70l1 1 2-2" fill="none" stroke="white" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparks from hammer -->
  <circle cx="24" cy="52" r="2.5" fill="#fbbf24" filter="url(#hot)" opacity="0.9"/>
  <circle cx="30" cy="48" r="1.8" fill="#f97316" filter="url(#hot)" opacity="0.8"/>
  <circle cx="18" cy="56" r="1.5" fill="#fde68a" filter="url(#hot)" opacity="0.7"/>
  <circle cx="28" cy="58" r="1" fill="#fbbf24" filter="url(#glow)" opacity="0.6"/>
  <circle cx="34" cy="54" r="0.8" fill="#fef3c7" filter="url(#glow)" opacity="0.5"/>

  <!-- code brackets floating around (subtle) -->
  <text x="100" y="50" font-family="monospace" font-size="8" fill="#f97316" opacity="0.3" font-weight="bold">{}</text>
  <text x="8" y="100" font-family="monospace" font-size="7" fill="#fbbf24" opacity="0.25">&lt;/&gt;</text>
</svg>
