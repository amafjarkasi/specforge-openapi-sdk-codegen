openapi: 3.0.3
info:
  title: Sample API
  version: "1.0.0"
  description: |
    A small but representative API used to exercise the codegen pipeline:
    $refs, allOf/oneOf composition, enums, arrays, date-time/uuid formats,
    query/path/body params, bearer auth, and cursor pagination.
servers:
  - url: https://api.example.com/v1
    description: Production
  - url: https://api.staging.example.com/v1
    description: Staging

security:
  - BearerAuth: []

tags:
  - name: Pets
    description: Pet inventory operations
  - name: Store
    description: Order operations

paths:
  /pets:
    get:
      operationId: listPets
      tags: [Pets]
      summary: List pets
      description: Returns a page of pets, cursor-paginated.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: species
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Species"
      responses:
        "200":
          description: A page of pets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetPage"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createPet
      tags: [Pets]
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/BadRequest"

  /pets/{petId}:
    get:
      operationId: getPet
      tags: [Pets]
      summary: Get a single pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: A pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePet
      tags: [Pets]
      summary: Delete a pet
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /store/orders:
    post:
      operationId: createOrder
      tags: [Store]
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Species:
      type: string
      enum: [dog, cat, bird, reptile]

    Tag:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: string

    Pet:
      type: object
      required: [id, name, species, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        species:
          $ref: "#/components/schemas/Species"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        age:
          type: integer
          format: int32
          nullable: true
        rating:
          type: number
          format: float
        createdAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    NewPet:
      type: object
      required: [name, species]
      properties:
        name:
          type: string
        species:
          $ref: "#/components/schemas/Species"
        age:
          type: integer
          format: int32

    PetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Pet"
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean

    Order:
      type: object
      required: [id, petId, quantity, status, placedAt]
      properties:
        id:
          type: integer
          format: int64
        petId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/OrderStatus"
        placedAt:
          type: string
          format: date-time
        shipDate:
          type: string
          format: date-time
          nullable: true

    NewOrder:
      type: object
      required: [petId, quantity]
      properties:
        petId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    OrderStatus:
      type: string
      enum: [placed, approved, delivered]

    PetEvent:
      oneOf:
        - $ref: "#/components/schemas/PetCreated"
        - $ref: "#/components/schemas/PetUpdated"
        - $ref: "#/components/schemas/PetDeleted"
      discriminator:
        propertyName: type

    PetCreated:
      type: object
      required: [type, pet]
      properties:
        type:
          type: string
          enum: [pet.created]
        pet:
          $ref: "#/components/schemas/Pet"

    PetUpdated:
      type: object
      required: [type, petId, changes]
      properties:
        type:
          type: string
          enum: [pet.updated]
        petId:
          type: string
        changes:
          type: object
          additionalProperties: true

    PetDeleted:
      type: object
      required: [type, petId]
      properties:
        type:
          type: string
          enum: [pet.deleted]
        petId:
          type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
