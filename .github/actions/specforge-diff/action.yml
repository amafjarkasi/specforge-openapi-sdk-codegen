name: 'specforge-diff'
description: 'Compare OpenAPI specs in PRs and comment the diff'
branding:
  icon: 'search'
  color: 'orange'

inputs:
  token:
    description: 'GitHub token for posting PR comments'
    required: true
  version:
    description: 'specforge version to install'
    required: false
    default: '0.2.2'
  spec-extensions:
    description: 'Comma-separated file extensions to treat as spec files'
    required: false
    default: 'yaml,yml,json'

runs:
  using: 'composite'
  steps:
    - name: Install specforge
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        ARCH=$(uname -m)
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        if [ "$OS" = "darwin" ]; then
          if [ "$ARCH" = "arm64" ]; then
            TARGET="aarch64-apple-darwin"
          else
            TARGET="x86_64-apple-darwin"
          fi
        elif [ "$OS" = "linux" ]; then
          if [ "$ARCH" = "aarch64" ]; then
            TARGET="aarch64-unknown-linux-gnu"
          else
            TARGET="x86_64-unknown-linux-gnu"
          fi
        else
          TARGET="x86_64-pc-windows-msvc"
        fi
        URL="https://github.com/amafjarkasi/specforge-openapi-sdk-codegen/releases/download/v${VERSION}/specforge-v${VERSION}-${TARGET}.tar.gz"
        echo "Downloading specforge v${VERSION} for ${TARGET}..."
        curl -sL "$URL" | tar xz
        sudo mv specforge /usr/local/bin/ 2>/dev/null || mv specforge /usr/local/bin/ || true
        specforge --version

    - name: Detect changed specs and post diff
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        SPEC_EXTENSIONS: ${{ inputs.spec-extensions }}
      run: |
        set -o pipefail

        # Resolve PR number from GitHub context
        if [ -n "${{ github.event.pull_request.number }}" ]; then
          PR_NUMBER="${{ github.event.pull_request.number }}"
        elif [ -n "${{ github.event.number }}" ]; then
          PR_NUMBER="${{ github.event.number }}"
        else
          echo "No pull request number found. Skipping."
          exit 0
        fi

        REPO="${{ github.repository }}"
        BASE_REF="${{ github.event.pull_request.base.sha }}"
        HEAD_REF="${{ github.event.pull_request.head.sha }}"

        echo "PR #${PR_NUMBER} on ${REPO}"
        echo "Base: ${BASE_REF}  Head: ${HEAD_REF}"

        # Build extension filter from input
        IFS=',' read -ra EXTS <<< "$SPEC_EXTENSIONS"
        FIND_ARGS=()
        for i in "${!EXTS[@]}"; do
          ext=$(echo "${EXTS[$i]}" | xargs)  # trim whitespace
          if [ "$i" -gt 0 ]; then
            FIND_ARGS+=("-o")
          fi
          FIND_ARGS+=("-name" "*.${ext}")
        done

        # Get list of changed files between base and head
        CHANGED_FILES=$(git diff --name-only --diff-filter=ACM "${BASE_REF}"..."${HEAD_REF}" 2>/dev/null || \
                        git diff --name-only --diff-filter=ACM "origin/${{ github.event.pull_request.base.ref }}"..."${HEAD_REF}" 2>/dev/null || \
                        echo "")

        if [ -z "$CHANGED_FILES" ]; then
          echo "No changed files detected."
          exit 0
        fi

        # Filter to spec files only
        SPEC_FILES=""
        while IFS= read -r file; do
          for ext in "${EXTS[@]}"; do
            ext=$(echo "$ext" | xargs)
            if [[ "$file" == *".${ext}" ]]; then
              # Only include files that look like OpenAPI specs
              if head -5 "$file" 2>/dev/null | grep -qiE 'openapi|swagger|info:|paths:'; then
                SPEC_FILES="${SPEC_FILES}${file}"$'\n'
              fi
              break
            fi
          done
          # Check non-YAML/JSON files that might be specs
          if [[ "$file" != *.yaml && "$file" != *.yml && "$file" != *.json ]]; then
            if head -5 "$file" 2>/dev/null | grep -qiE 'openapi|swagger'; then
              SPEC_FILES="${SPEC_FILES}${file}"$'\n'
            fi
          fi
        done <<< "$CHANGED_FILES"

        # Remove trailing newline
        SPEC_FILES=$(echo "$SPEC_FILES" | sed '/^$/d')

        if [ -z "$SPEC_FILES" ]; then
          echo "No OpenAPI spec files changed in this PR."
          exit 0
        fi

        echo "Changed spec files:"
        echo "$SPEC_FILES"

        # --- Build the diff report ---
        REPORT=""
        HAS_BREAKING=false
        DIFF_COUNT=0

        while IFS= read -r spec_file; do
          [ -z "$spec_file" ] && continue
          DIFF_COUNT=$((DIFF_COUNT + 1))

          echo ""
          echo "=== Diffing: ${spec_file} ==="

          # Extract the old version from the base branch
          OLD_FILE="/tmp/specforge-old-$(basename "${spec_file}")"
          git show "${BASE_REF}:${spec_file}" > "${OLD_FILE}" 2>/dev/null
          if [ $? -ne 0 ]; then
            echo "File ${spec_file} is new (not present in base). Skipping diff."
            REPORT+=$'\n'"### \`${spec_file}\`"$'\n\n'
            REPORT+=$'> **New file** -- no previous version to compare against.'$'\n\n'
            continue
          fi

          NEW_FILE="/tmp/specforge-new-$(basename "${spec_file}")"
          git show "${HEAD_REF}:${spec_file}" > "${NEW_FILE}" 2>/dev/null

          # Run specforge diff, capture output and exit code
          DIFF_OUTPUT=""
          DIFF_EXIT=0
          DIFF_OUTPUT=$(specforge diff "${OLD_FILE}" "${NEW_FILE}" 2>&1) || DIFF_EXIT=$?

          # specforge diff exits 1 when breaking changes are found
          FILE_BREAKING=false
          if [ "$DIFF_EXIT" -eq 1 ]; then
            FILE_BREAKING=true
            HAS_BREAKING=true
          fi

          if [ "$DIFF_EXIT" -eq 2 ] || [ "$DIFF_EXIT" -gt 2 ]; then
            echo "specforge diff failed with exit code ${DIFF_EXIT}"
            REPORT+=$'\n'"### \`${spec_file}\`"$'\n\n'
            REPORT+="> Error running specforge diff. Exit code: ${DIFF_EXIT}"$'\n\n'
            REPORT+='```'$'\n'"${DIFF_OUTPUT}"$'\n''```'$'\n\n'
            continue
          fi

          if [ -z "$DIFF_OUTPUT" ] || echo "$DIFF_OUTPUT" | grep -qi "no differences"; then
            echo "No differences for ${spec_file}"
            REPORT+=$'\n'"### \`${spec_file}\`"$'\n\n'
            REPORT+=$'> No API changes detected.'$'\n\n'
            continue
          fi

          # Parse the output to build a markdown report
          BREAKING_LINES=""
          INFO_LINES=""
          while IFS= read -r line; do
            if echo "$line" | grep -q "^breaking:"; then
              msg=$(echo "$line" | sed 's/^breaking: //')
              BREAKING_LINES+="- ❌ ${msg}"$'\n'
            elif echo "$line" | grep -q "^info:"; then
              msg=$(echo "$line" | sed 's/^info: //')
              INFO_LINES+="- ✅ ${msg}"$'\n'
            elif echo "$line" | grep -qE "^[0-9]+ breaking change"; then
              # Summary line -- skip, we compute our own
              :
            elif [ -n "$line" ]; then
              # Any other non-empty output line
              INFO_LINES+="${line}"$'\n'
            fi
          done <<< "$DIFF_OUTPUT"

          # Assemble the per-file section
          REPORT+=$'\n'"### \`${spec_file}\`"$'\n\n'

          if [ -n "$BREAKING_LINES" ]; then
            REPORT+='**Breaking changes:**'$'\n\n'
            REPORT+="${BREAKING_LINES}"$'\n'
          fi

          if [ -n "$INFO_LINES" ]; then
            REPORT+='**Non-breaking changes:**'$'\n\n'
            REPORT+="${INFO_LINES}"$'\n'
          fi

        done <<< "$SPEC_FILES"

        # --- Compose the full comment ---
        if [ "$HAS_BREAKING" = true ]; then
          STATUS_TEXT="**Breaking changes detected.** This PR modifies OpenAPI specs in ways that may break existing clients."
        else
          STATUS_TEXT="No breaking changes detected."
        fi

        if [ "$DIFF_COUNT" -eq 1 ]; then
          TITLE="specforge: OpenAPI spec diff (1 file)"
        else
          TITLE="specforge: OpenAPI spec diff (${DIFF_COUNT} files)"
        fi

        MARKER="<!-- specforge-diff -->"
        BODY=""
        BODY+="<details><summary><b>${TITLE}</b></summary>"$'\n\n'
        BODY+="${STATUS_TEXT}"$'\n\n'
        BODY+="${REPORT}"$'\n'
        BODY+="<i>Powered by <a href=\"https://github.com/amafjarkasi/specforge-openapi-sdk-codegen\">specforge</a></i>"$'\n'
        BODY+="</details>"$'\n'

        FULL_BODY="${MARKER}"$'\n\n'"${BODY}"

        # --- Post or update the PR comment ---
        # Look for an existing specforge comment
        EXISTING_COMMENT_ID=""
        COMMENTS=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[] | select(.body | contains("'"${MARKER}"'")) | .id' 2>/dev/null || echo "")
        if [ -n "$COMMENTS" ]; then
          EXISTING_COMMENT_ID=$(echo "$COMMENTS" | head -1)
        fi

        if [ -n "$EXISTING_COMMENT_ID" ]; then
          echo "Updating existing comment ${EXISTING_COMMENT_ID}"
          gh api "repos/${REPO}/issues/comments/${EXISTING_COMMENT_ID}" \
            --method PATCH \
            --field body="${FULL_BODY}" \
            --silent
        else
          echo "Creating new comment on PR #${PR_NUMBER}"
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --method POST \
            --field body="${FULL_BODY}" \
            --silent
        fi

        # --- Final status ---
        echo ""
        echo "========================================"
        if [ "$HAS_BREAKING" = true ]; then
          echo "FAIL: Breaking changes found in OpenAPI specs."
          echo "========================================"
          exit 1
        else
          echo "PASS: No breaking changes found."
          echo "========================================"
          exit 0
        fi
